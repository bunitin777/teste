const container = document.getElementById("container");
const detalhe = document.getElementById("detalhe");

paises.forEach(p => {
  const div = document.createElement("div");
  div.className = "card";

  const img = p[1].startsWith("http")
    ? p[1]
    : "https://flagcdn.com/w160/" + p[1] + ".png";

  div.innerHTML = `
    <img src="${img}">
    <h3>${p[0]}</h3>
  `;

  div.onclick = () => abrir(p[0]);
  container.appendChild(div);
});

function abrir(nome){
  const info = dados[nome] || {
    titulos: "Sem dados ainda",
    historia: "Informações em breve",
    jogadores: [],
    lendas: []
  };

  container.style.display="none";
  detalhe.style.display="block";

  detalhe.innerHTML = `
    <button onclick="voltar()">⬅ Voltar</button>
    <h2>${nome}</h2>
    <p>🏆 ${info.titulos}</p>
    <p>📜 ${info.historia}</p>

    <h3>⭐ Jogadores</h3>
    <div class="jogadores">
      ${info.jogadores.map(j => `<div><img src="${j[1] || 'https://via.placeholder.com/100'}"><br>${j[0]}</div>`).join("")}
    </div>

    <h3>👑 Lendas</h3>
    <div class="jogadores">
      ${info.lendas.map(j => `<div><img src="${j[1] || 'https://via.placeholder.com/100'}"><br>${j[0]}</div>`).join("")}
    </div>
  `;
}

function voltar(){
  detalhe.style.display="none";
  container.style.display="grid";
}
